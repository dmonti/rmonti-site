<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rafa - Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      body { font-family: 'Courier New', Courier, monospace; }
      div.sidebar {
        padding: 200px 0 25px;
      }
      div.sidebar > span {
        font-size: 1.1rem;
        font-weight: bold;
      }
      nav > .footer {
        font-size: 0.8rem;
      }
      nav > .social {
        font-size: 0.8rem;
        padding-bottom: 50px;
      }

      :root {
        --bs-body-color: #fff;
        --bs-body-bg: #000;
        --bs-border-color: #fff;
        --bs-link-color: #fff;
        --bs-link-hover-color: #fff;
      }

      body {
        color: #fff;
        background: #000;
      }

      a,
      a:visited,
      a:hover,
      a:active {
        color: #fff !important;
        text-decoration-color: #fff;
      }

      .border,
      .border-top,
      .border-end,
      .border-bottom,
      .border-start {
        border-color: #fff !important;
      }


      nav.site-sidebar {
        width: 170px;
        text-align: left;
      }

      nav.site-sidebar .sidebar {
        align-items: flex-start;
        text-align: left;
      }

      nav.site-sidebar a {
        display: block;
        padding: 4px 0;
        text-align: left;
        text-transform: uppercase;
      }

      .site-shell {
        min-height: 100vh;
        position: relative;
      }

      nav.site-sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 170px;
        height: 100vh;
        overflow-y: auto;
        padding-bottom: 16px;
        z-index: 1030;
      }
      
      main.site-main {
        margin-left: 170px;
      }

      nav.site-sidebar .social {
        margin-top: auto;
      }

      nav.site-sidebar .footer {
        padding-top: 8px;
      }

      nav.site-sidebar .footer small {
        white-space: nowrap;
        display: block;
      }

      .site-main {
        padding: 60px 60px 60px 80px;
      }

      .offcanvas {
        background: #000;
        color: #fff;
        border-color: #fff;
        box-shadow: none;
      }

      .offcanvas-header {
        border-bottom: 1px solid #fff;
      }

      .btn-close { opacity: 1; filter: invert(1); }

      @media (max-width: 991.98px) {
        .site-main {
          padding: 24px 16px;
        }
      }

      @media (max-width: 767.98px) {
        nav.site-sidebar {
          display: none;
        }
        
        main.site-main {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
    </header>

    <div class="d-flex site-shell">
        <nav class="site-sidebar d-none d-md-flex flex-column border-end p-4">
          <div class="sidebar d-flex flex-column gap-2">
            <a href="about.html" class="text-decoration-none fw-bold" style="font-size:1.1rem;">Rafael<br />Monti</a>
          </div>
          <a href="about.html" class="text-decoration-none">About</a>
          <a href="index.html" class="text-decoration-none">Work</a>
          <a href="awards.html" class="text-decoration-none">Awards</a>
          <a href="bts.html" class="text-decoration-none">BTS</a>
          <a href="contact.html" class="text-decoration-none">Contact</a>
          <div class="social d-flex flex-column gap-1 mt-auto pt-3">
            <a href="https://www.instagram.com/r_montis" target="_blank" rel="noopener" class="text-decoration-none">Instagram</a>
            <a href="https://linkedin.com/" target="_blank" rel="noopener" class="text-decoration-none">LinkedIn</a>
          </div>
          <div class="footer pt-3">
            <small>&copy; 2026 Rafael Monti</small>
          </div>
        </nav>

        <div
          class="offcanvas offcanvas-start d-md-none"
          tabindex="-1"
          id="sidebarOffcanvas"
          aria-labelledby="sidebarOffcanvasLabel"
        >
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="sidebarOffcanvasLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>
          <div class="offcanvas-body">
            <div class="d-flex flex-column gap-2">
              <a class="text-decoration-none" href="about.html" data-bs-dismiss="offcanvas" style="text-transform: uppercase;">About</a>
              <a class="text-decoration-none" href="index.html" data-bs-dismiss="offcanvas" style="text-transform: uppercase;">Work</a>
              <a class="text-decoration-none" href="awards.html" data-bs-dismiss="offcanvas" style="text-transform: uppercase;">Awards</a>
              <a class="text-decoration-none" href="bts.html" data-bs-dismiss="offcanvas" style="text-transform: uppercase;">BTS</a>
              <a class="fw-semibold text-decoration-none" href="contact.html" data-bs-dismiss="offcanvas" style="text-transform: uppercase;">Contact</a>
              <div class="pt-3">
                <a class="text-decoration-none" href="https://www.instagram.com/r_montis" target="_blank" rel="noopener">Instagram</a>
              </div>
            </div>
          </div>
        </div>

        <main class="site-main flex-grow-1">
          <div class="d-md-none mb-4">
            <button class="btn btn-outline-light rounded-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas" aria-controls="sidebarOffcanvas">Menu</button>
          </div>

          <section>
            <h2 class="h6 mb-3" style="text-transform: uppercase; letter-spacing: 0.02em;">Contact</h2>
            <div style="font-size: 0.95rem;">
              <a href="mailto:you@example.com">you@example.com</a>
            </div>
          </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
