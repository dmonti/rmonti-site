      /* Behance-style layout with flush images */

        width: 100%;

        flex-wrap: wrap;
        gap: 0;

        flex: 1;
        min-width: 300px;
      }
      
      .project-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0;
        margin-bottom: 0;
      }
      
      .project-grid > div {
        min-height: 100%;
        display: flex;
        align-items: stretch;
      }
      
      .project-grid > div img {
        width: 100%;
        height: auto;
        object-fit: contain;
        max-width: 100%;
      }
      
      /* Full-width absolute positioning for exact height control */
      .fixed-height-images {
        position: relative;
        width: 100%;
        height: 480px; /* Increased height */
        overflow: hidden;
        margin: 0;
        padding: 0;
        max-width: 100%;
      }
      
      .image-pair {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
      }
      
      .magic-container {
        position: relative;
        width: 40%;
        height: 100%;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        overflow: hidden;
      }
      
      .heart-container {
        position: relative;
        width: 60%;
        height: 100%;
        display: flex;
        justify-content: flex-start;
        align-items: center;
        overflow: hidden;
      }
      
      .magic-container img,
      .heart-container img {
        position: relative;
        height: 480px; /* Increased height */
        width: auto;
        display: block;
        max-width: none;
      }
      
      /* Equal row for two images with exact same height */
      .equal-row {
        display: flex;
        width: 100%;
        height: 500px;
        overflow: hidden;
      }
      
      .image-half {
        height: 100%;
        overflow: hidden;
        display: flex;
      }
      
      .image-half:first-child {
        flex: 0.42;
      }
      
      .image-half:last-child {
        flex: 0.58;
      }
      
      .image-half img {
        height: 100%;
        width: 100%;
        object-fit: cover;
        object-position: center;
      }
      
      /* Custom class for flush image pairs */
      .flush-image-pair {
        padding: 0;
        gap: 0;
        font-size: 0; /* Remove whitespace between inline elements */
        overflow: visible;
        border-spacing: 0;
        width: 100vw;
        max-width: 100vw;
        margin-left: -15px; /* Offset container padding */
        margin-right: -15px;
      }
      
      /* Table-based layout for no-gap images */
      .no-gap-container {
        padding: 0;
        overflow: hidden;
        width: 100%;
        font-size: 0; /* Remove font space */
        line-height: 0;
        display: block;
      }
      
      .image-table {
        width: 100%;
        border-collapse: collapse;
        border-spacing: 0;
        margin: 0;
        padding: 0;
        height: 450px;
      }
      
      .left-cell {
        width: 65%;
        height: 450px;
        padding: 0;
        margin: 0;
        vertical-align: top;
      }
      
      .right-cell {
        width: 35%;
        height: 450px;
        padding: 0;
        margin: 0;
        vertical-align: top;
      }
      
      .full-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        padding: 0;
        margin: 0;
      }
      
      .chair-magazine-pair .image-half {
        padding: 0;
        margin: 0;
        overflow: hidden;
        font-size: 0;
        line-height: 0;
        display: inline-block;
      }
      
      .chair-magazine-pair .image-half:first-child {
        width: 65%;
        flex: none;
      }
      
      .chair-magazine-pair .image-half:last-child {
        width: 35%;
        flex: none;
      }
      
      .chair-magazine-pair .image-half img {
        object-fit: cover;
        width: 100%;
        height: 100%;
        display: block;
        margin: 0;
        padding: 0;
      }
