<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rafa - BTS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      body { font-family: 'Courier New', Courier, monospace; }
      div.sidebar {
        padding: 200px 0 25px;
      }
      div.sidebar > span {
        font-size: 1.1rem;
        font-weight: bold;
      }
      nav > .footer {
        font-size: 0.8rem;
      }
      nav > .social {
        font-size: 0.8rem;
        padding-bottom: 50px;
      }

      :root {
        --bs-body-color: #fff;
        --bs-body-bg: #000;
        --bs-border-color: #fff;
        --bs-link-color: #fff;
        --bs-link-hover-color: #fff;
      }

      body {
        color: #fff;
        background: #000;
      }

      a,
      a:visited,
      a:hover,
      a:active {
        color: #fff !important;
        text-decoration-color: #fff;
      }

      .border,
      .border-top,
      .border-end,
      .border-bottom,
      .border-start {
        border-color: #fff !important;
      }


      nav.site-sidebar {
        width: 170px;
        text-align: left;
      }

      nav.site-sidebar .sidebar {
        align-items: flex-start;
        text-align: left;
      }

      nav.site-sidebar a {
        display: block;
        padding: 4px 0;
        text-align: left;
        text-transform: uppercase;
      }

      .site-shell {
        min-height: 100vh;
        position: relative;
      }

      nav.site-sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 170px;
        height: 100vh;
        overflow-y: auto;
        padding-bottom: 16px;
        z-index: 1030;
      }
      
      main.site-main {
        margin-left: 170px;
      }

      nav.site-sidebar .social {
        margin-top: auto;
      }

      nav.site-sidebar .footer {
        padding-top: 8px;
      }

      nav.site-sidebar .footer small {
        white-space: nowrap;
        display: block;
      }

      .site-main {
        padding: 60px 60px 60px 80px;
      }

      .bts-grid {
        columns: 3;
        column-gap: 0;
        margin-top: -60px;
        margin-left: -80px;
        margin-right: -60px;
      }

      .bts-grid img {
        width: 100%;
        height: auto;
        display: block;
        break-inside: avoid;
      }

      @media (max-width: 991.98px) {
        .bts-grid { columns: 2; }
      }

      @media (max-width: 575.98px) {
        .bts-grid { columns: 1; }
      }

      .offcanvas {
        background: #000;
        color: #fff;
        border-color: #fff;
        box-shadow: none;
      }

      .offcanvas-header {
        border-bottom: 1px solid #fff;
      }

      .btn-close { opacity: 1; filter: invert(1); }

      @media (max-width: 991.98px) {
        .site-main {
          padding: 24px 16px;
        }
      }

      @media (max-width: 767.98px) {
        nav.site-sidebar {
          display: none;
        }
        
        main.site-main {
          margin-left: 0;
        }
      }
    </style>
  </head>

    </header>
