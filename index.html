<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rafa - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      body { font-family: 'Courier New', Courier, monospace; }
      div.sidebar {
        padding: 200px 0 25px;
      }
      div.sidebar > span {
        font-size: 1.1rem;
        font-weight: bold;
      }
      nav > .footer {
        font-size: 0.8rem;
      }
      nav > .social {
        font-size: 0.8rem;
        padding-bottom: 50px;
      }

      :root {
        --bs-body-color: #fff;
        --bs-body-bg: #000;
        --bs-border-color: #fff;
        --bs-link-color: #fff;
        --bs-link-hover-color: #fff;
      }

      body {
        color: #fff;
        background: #000;
      }

      a,
      a:visited,
      a:hover,
      a:active {
        color: #fff !important;
        text-decoration-color: #fff;
      }

      .border,
      .border-top,
      .border-end,
      .border-bottom,
      .border-start {
        border-color: #fff !important;
      }


      nav.site-sidebar {
        width: 170px;
        text-align: left;
      }

      nav.site-sidebar .sidebar {
        align-items: flex-start;
        text-align: left;
      }

      nav.site-sidebar a {
        display: block;
        padding: 4px 0;
        text-align: left;
        text-transform: uppercase;
      }

      .site-shell {
        min-height: 100vh;
        position: relative;
      }

      nav.site-sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 170px;
        height: 100vh;
        overflow-y: auto;
        padding-bottom: 16px;
        z-index: 1030;
      }
      
      main.site-main {
        margin-left: 170px;
      }

      nav.site-sidebar .social {
        margin-top: auto;
      }

      nav.site-sidebar .footer {
        padding-top: 8px;
      }

      nav.site-sidebar .footer small {
        white-space: nowrap;
        display: block;
      }

      .site-main {
        padding: 60px 60px 60px 80px;
      }

      .work-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 50px 60px;
        align-items: start;
      }

      .work-tile {
        width: 100%;
        border: 1px solid #fff;
        background: #000;
        aspect-ratio: 16 / 9;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      
      .project-image,
      .project-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .work-caption {
        margin-top: 8px;
        font-size: 0.75rem;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }


      .project-card {
        display: block;
        color: inherit;
        text-decoration: none;
      }

      .project-card:hover,
      .project-card:focus {
        color: inherit;
        text-decoration: none;
        outline: none;
      }

.offcanvas {
        background: #000;
        color: #fff;
        border-color: #fff;
        box-shadow: none;
      }

      .offcanvas-header {
        border-bottom: 1px solid #fff;
      }

      .btn-close { opacity: 1; filter: invert(1); }

      @media (max-width: 991.98px) {
        .site-main {
          padding: 24px 16px;
        }

        .work-grid {
          grid-template-columns: 1fr;
          gap: 28px;
        }
      }

      @media (max-width: 767.98px) {
        nav.site-sidebar {
          display: none;
        }
        
        main.site-main {
          margin-left: 0;
        }
      }
    </style>
  </head>

    </header>

          </div>
          <a href="about.html" class="text-decoration-none">About</a>
          <a href="index.html" class="text-decoration-none">Work</a>
          <a href="awards.html" class="text-decoration-none">Awards</a>
          <a href="bts.html" class="text-decoration-none">BTS</a>
          <a href="contact.html" class="text-decoration-none">Contact</a>
          <div class="social d-flex flex-column gap-1 mt-auto pt-3">
            <a href="https://www.instagram.com/r_montis" target="_blank" rel="noopener" class="text-decoration-none">Instagram</a>
            <a href="https://linkedin.com/" target="_blank" rel="noopener" class="text-decoration-none">LinkedIn</a>
          </div>
          <div class="footer pt-3">
            <small>&copy; 2026 Rafael Monti</small>
          </div>
        </nav>

            <h5 class="offcanvas-title" id="sidebarOffcanvasLabel">Menu</h5>

          </div>
          <div class="offcanvas-body">
            <div class="d-flex flex-column gap-2">
              <a class="text-decoration-none" href="about.html" data-bs-dismiss="offcanvas" style="text-transform: uppercase;">About</a>
              <a class="fw-semibold text-decoration-none" href="index.html" data-bs-dismiss="offcanvas" style="text-transform: uppercase;">Work</a>
              <a class="text-decoration-none" href="awards.html" data-bs-dismiss="offcanvas" style="text-transform: uppercase;">Awards</a>

              <div class="pt-3">
                <a class="text-decoration-none" href="https://www.instagram.com/r_montis" target="_blank" rel="noopener">Instagram</a>
              </div>
            </div>
          </div>
        </div>

        <main class="site-main flex-grow-1">
          <div class="d-md-none mb-4">
            <button class="btn btn-outline-light rounded-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas" aria-controls="sidebarOffcanvas">Menu</button>
          </div>

          <section class="mb-5">
            <h2 class="h6 mb-3" style="text-transform: uppercase; letter-spacing: 0.02em;">Work</h2>
            <div class="work-grid">
              <div>
                <a class="project-card" href="project-ashe-versus.html">

              <div>

              <div>
                <a class="project-card" href="project-this-is-havaianas.html">
                  <div class="work-tile">
                    <img src="assets/havaianas/00_havaianas cover_small.png" alt="This Is Havaianas Cover" class="project-image">

              <div>
                <a class="project-card" href="project-title-2.html">

                  </div>

              <div>
                <a class="project-card" href="project-title-3.html">
                  <div class="work-tile">
                    <img src="assets/havaianas wild/thumb_havaianas_wild.jpg" alt="Havaianas Gone Wild" class="project-image">
                  </div>
                  <div class="work-caption">HAVAIANAS | GONE WILD</div>

              </div>
            </div>
          </section>
        </main>
    </div>
