    <style>

      nav.site-sidebar a:not(.sidebar-logo-link) { margin-left: 31px; }

      .btn-close { opacity: 1; filter: none; }

      .project-hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;

      .project-video {

        aspect-ratio: 16 / 9;
        border: 1px solid #000;

        margin: 70px auto 0;

        height: 100%;

        margin-left: -80px;

      @media (max-width: 767.98px) {
        nav.site-sidebar {
          display: none;
        }

        main.site-main {
          margin-left: 0;
        }
