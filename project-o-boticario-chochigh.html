<!doctype html>
<html lang="en">
  <head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      body { font-family: 'Courier New', Courier, monospace; }
      div.sidebar { padding: 200px 0 25px; }
      div.sidebar > span { font-size: 1.1rem; font-weight: bold; }
      nav > .footer { font-size: 0.8rem; }
      nav > .social { font-size: 0.8rem; padding-bottom: 50px; }

      :root {
        --bs-body-color: #fff;
        --bs-body-bg: #000;
        --bs-border-color: #fff;
        --bs-link-color: #fff;
        --bs-link-hover-color: #fff;
      }

      body { color: #fff; background: #000; }

      a,
      a:visited,
      a:hover,
      a:active { color: #fff !important; text-decoration-color: #fff; }

      .border,
      .border-top,
      .border-end,
      .border-bottom,
      .border-start { border-color: #fff !important; }

      nav.site-sidebar { position: fixed; top: 0; bottom: 0; left: 0; width: 170px; height: 100vh; text-align: left; overflow-y: auto; z-index: 1030; }
      nav.site-sidebar .sidebar { align-items: flex-start; text-align: left; }
      nav.site-sidebar a { display: block; padding: 4px 0; text-align: left; text-transform: uppercase; }

      .site-shell { min-height: 100vh; position: relative; }
      .site-main { padding: 60px 60px 60px 80px; margin-left: 170px; }

      nav.site-sidebar { padding-bottom: 16px; }
      nav.site-sidebar .social { margin-top: auto; }
      nav.site-sidebar .footer { padding-top: 8px; }
      nav.site-sidebar .footer small { white-space: nowrap; display: block; }

      .offcanvas { background: #000; color: #fff; border-color: #fff; box-shadow: none; }
      .offcanvas-header { border-bottom: 1px solid #fff; }
      .btn-close { opacity: 1; filter: invert(1); }

      .project-hero { width: 100%; border: 1px solid #fff; background: #000; height: 260px; margin-bottom: 24px; }

      .project-hero {
        width: auto;
        margin-top: -60px;
        margin-left: -80px;
        margin-right: -60px;
      }

      .project-hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
      }

      @media (min-width: 768px) {
        .project-hero {
          border-left: 0;
        }
      }
      .project-title { font-size: 1.25rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 16px; }

      .project-role { font-size: 0.85rem; font-weight: 400; text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 24px; }
      .project-body { max-width: 70ch; font-size: 0.9rem; line-height: 1.55; }

      .project-video {
        width: min(760px, 92%);
        aspect-ratio: 16 / 9;
        border: 1px solid #fff;
        background: #000;
        margin: 70px auto 0;
      }

      .project-video iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      @media (max-width: 991.98px) {
        .site-main { padding: 24px 16px; }

        .project-hero {
          margin-top: -24px;
          margin-left: -16px;
          margin-right: -16px;
        }
        div.sidebar { padding: 40px 0 25px; }
      }
      
      @media (max-width: 767.98px) {
        nav.site-sidebar {
          display: none;
        }
        
        main.site-main {
          margin-left: 0;
        }
      }
    </style>
